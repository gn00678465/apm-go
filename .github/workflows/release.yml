name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ancestor 守門需要完整歷史

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # ancestor 守門（fail-closed）：只允許從 main 的歷史發版，
      # feature branch 上的 tag 一律拒絕（版本字串本身由 ldflags 注入）
      - name: Verify tag commit is on main
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points to $GITHUB_SHA, which is not an ancestor of origin/main"
            exit 1
          fi
          echo "ancestor check ok: $GITHUB_SHA is on main"

      - name: Build binaries
        run: |
          mkdir -p dist
          for os in windows linux darwin; do
            for arch in amd64 arm64; do
              ext=""
              [ "$os" = "windows" ] && ext=".exe"
              echo "building $os/$arch"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                go build -trimpath \
                -ldflags "-s -w -X github.com/apm-go/apm/internal/version.Version=${GITHUB_REF_NAME#v}" \
                -o "dist/apm-go-$os-$arch$ext" ./cmd/apm-go
            done
          done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # pre-release tag（含 '-'，如 v0.3.0-beta.1）標記 prerelease，
          # 否則會成為 releases/latest，install 腳本預設就裝到 beta
          prerelease_flag=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease_flag="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes $prerelease_flag
