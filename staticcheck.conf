# staticcheck configuration for tools/gate.sh.
# ST1005 (error-string capitalization/punctuation) is off: apm-go reproduces
# the Oracle error messages byte for byte (PRODUCT.md, output contract), and
# those messages are capitalized sentences.
# ST1018 (Unicode format characters in string literals) is off: the security
# scanner tests deliberately embed zero-width characters as fixtures.
checks = ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-ST1005", "-ST1018"]
